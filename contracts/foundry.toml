# SymbolonVault — target toolchain is Arc Foundry (arc-forge). See docs/06_CONTRACTS_AND_CIRCLE.md Part A.
# Stock Foundry (forge 1.5.1) is the local dev loop only (docs/VERIFY_LOG.md V-19).
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# V-21 (WP-07 decision, docs/QUESTIONS.md): solc 0.8.30 targeting `prague`. Prague is a strict subset of
# Osaka (Arc's baseline), so every opcode the compiler emits exists on Arc. solc 0.8.30 lists `osaka`
# only as "experimental"; nothing in this contract needs an Osaka-only opcode (CLZ).
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
# v2 (docs/16 §2.4, WP-07): byte-reproducible builds so a Loss Bound Certificate can match deployed code.
# Build.t.sol asserts both settings from the artifact metadata; script/check-reproducible-build.mjs
# compares two clean builds byte for byte.
# VERIFY(V-19): confirm arc-forge accepts these keys (stock forge 1.5.1 does).
bytecode_hash = "none"
cbor_metadata = false
# Remappings are explicit; auto-detection would pick up the nested remappings of the OZ repo.
auto_detect_remappings = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Tests read the cross-language EIP-712 vectors (packages/schemas, WP-01) and the build artifact
# (Build.t.sol, certificate code match). The deploy script writes deployments/<network>.json.
fs_permissions = [
  { access = "read", path = "../packages/schemas/vectors" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "./cache/deploy-test" },
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = false
